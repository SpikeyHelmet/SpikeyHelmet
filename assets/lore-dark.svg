<svg xmlns="http://www.w3.org/2000/svg" width="840" height="514" viewBox="0 0 840 514" role="img" aria-label="The lore: first computer at 7, internet at 11, chronically online since. Java and JavaScript are my OGs; self-taught on MERN, now in enterprise IAM at Zoho. Off the clock: gaming, guitar, game servers and IoT. 2027 goals: more open source, real AI adoption on the team, the Rust era, and touching grass. &quot;I got 99 problems but a 401 ain&#x27;t one.&quot;">
<title>The lore: first computer at 7, internet at 11, chronically online since. Java and JavaScript are my OGs; self-taught on MERN, now in enterprise IAM at Zoho. Off the clock: gaming, guitar, game servers and IoT. 2027 goals: more open source, real AI adoption on the team, the Rust era, and touching grass. &quot;I got 99 problems but a 401 ain&#x27;t one.&quot;</title>
<style><![CDATA[
.d{font-family:'Inter Tight', Inter, 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}
.m{font-family:'Geist Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace}

.ch{opacity:0;animation:ch 4.5s linear infinite}
@keyframes ch{0%{opacity:0}4%{opacity:1}30%{opacity:0}100%{opacity:0}}
.hu{animation:hu 6s linear infinite}
@keyframes hu{0%,100%{fill:#6e9bff}33%{fill:#3ce6a8}66%{fill:#b79cff}}
.pu{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{opacity:.35}}
.bl{animation:bl 1.6s steps(1) infinite}
@keyframes bl{50%{opacity:.18}}
.pk{opacity:0;animation:pk 1.8s linear infinite}
@keyframes pk{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(64px);opacity:0}}


@media (prefers-reduced-motion: reduce){*{animation:none!important}.ch{opacity:0}.pk{opacity:0}}
]]></style>
<defs><filter id="glow" filterUnits="userSpaceOnUse" x="-840" y="-514" width="2520" height="1542"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x=".5" y=".5" width="839" height="513" rx="24" fill="#151515" stroke="#313131"/><text x="40.0" y="48.0" class="m" font-size="12" font-weight="500" fill="#8f91a3" letter-spacing="1.2">THE LORE</text><text x="39.0" y="82.0" class="d" font-size="28" font-weight="700" fill="#f5f5f5" letter-spacing="-0.6">Started at 7. Never logged off.</text><text x="40.0" y="120.0" class="d" font-size="15" font-weight="400" fill="#c9cbda">Got my first computer at 7, the internet at 11, and I&#x27;ve been chronically online since.</text><text x="40.0" y="143.0" class="d" font-size="15" font-weight="400" fill="#c9cbda">Java and JavaScript are my OGs. Self-taught on MERN, now deep in enterprise IAM at Zoho,</text><text x="40.0" y="166.0" class="d" font-size="15" font-weight="400" fill="#c9cbda">making sure the right people get in and everyone else gets left on read.</text><text x="40.0" y="189.0" class="d" font-size="15" font-weight="400" fill="#c9cbda">Off the clock: gaming, guitar, game servers, and convincing ceiling fans to speak MQTT.</text><rect x="40" y="214" width="760" height="204" rx="16" fill="#0b0b14" stroke="#313131"/><circle cx="62" cy="236" r="5" fill="#ff5a5a"/><circle cx="78" cy="236" r="5" fill="#ffb020"/><circle cx="94" cy="236" r="5" fill="#3ce6a8"/><text x="780.0" y="240.0" class="m" font-size="11.5" font-weight="500" fill="#8f91a3" text-anchor="end" letter-spacing="0.6">~/2027 $ cat goals.patch</text><line x1="40" y1="256" x2="800" y2="256" stroke="#2a2d40"/><text x="60.0" y="294.0" class="d" font-size="24" font-weight="700" fill="#f4f4fa" letter-spacing="-0.5">2027: let him cook.</text><text x="60.0" y="326.0" class="m" font-size="13" font-weight="700" fill="#3ce6a8">+</text><text x="80.0" y="326.0" class="m" font-size="12.5" font-weight="400" fill="#c9cbda">open source arc: more merged PRs than open browser tabs. delusional? we ball.</text><text x="60.0" y="350.0" class="m" font-size="13" font-weight="700" fill="#3ce6a8">+</text><text x="80.0" y="350.0" class="m" font-size="12.5" font-weight="400" fill="#c9cbda">AI adoption: get the team actually shipping with AI, not just saying it in standup.</text><text x="60.0" y="374.0" class="m" font-size="13" font-weight="700" fill="#ffb020">~</text><text x="80.0" y="374.0" class="m" font-size="12.5" font-weight="400" fill="#c9cbda">rust era: me and the borrow checker are in a situationship.</text><text x="60.0" y="398.0" class="m" font-size="13" font-weight="700" fill="#3ce6a8">+</text><text x="80.0" y="398.0" class="m" font-size="12.5" font-weight="400" fill="#c9cbda">touch grass: scheduled. cron job still pending code review.</text><g transform="rotate(6 711.6 282.0)"><rect x="682.0" y="273.0" width="63.2" height="24" rx="6" fill="#0b0b14" opacity=".25"/><rect x="680.0" y="270.0" width="63.2" height="24" rx="6" fill="#ffb020"/><text x="711.6" y="286.0" class="m" font-size="11" font-weight="700" fill="#0b0b14" text-anchor="middle" letter-spacing="0.6">NO CAP</text></g><text x="40.0" y="464.0" class="d" font-size="22" font-weight="700" fill="#f5f5f5" letter-spacing="-0.4">“I got 99 problems but a 401 ain&#x27;t one.”</text><text x="40.0" y="490.0" class="m" font-size="11.5" font-weight="500" fill="#8f91a3" letter-spacing="1.2">— EVERY IAM ENGINEER, PROBABLY</text>
</svg>
