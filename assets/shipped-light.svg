<svg xmlns="http://www.w3.org/2000/svg" width="840" height="398" viewBox="0 0 840 398" role="img" aria-label="What I&#x27;ve shipped at Zoho: directory sync for Azure AD and on-prem Active Directory over WebSockets; Identity360 MFA Agents, GRC with JIT Access, Reports and Dashboards; an internal tool that cut CI/CD from 20 to 8 minutes; 20+ zero-downtime MySQL migrations.">
<title>What I&#x27;ve shipped at Zoho: directory sync for Azure AD and on-prem Active Directory over WebSockets; Identity360 MFA Agents, GRC with JIT Access, Reports and Dashboards; an internal tool that cut CI/CD from 20 to 8 minutes; 20+ zero-downtime MySQL migrations.</title>
<style><![CDATA[
.d{font-family:'Inter Tight', Inter, 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}
.m{font-family:'Geist Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace}

.ch{opacity:0;animation:ch 4.5s linear infinite}
@keyframes ch{0%{opacity:0}4%{opacity:1}30%{opacity:0}100%{opacity:0}}
.hu{animation:hu 6s linear infinite}
@keyframes hu{0%,100%{fill:#6e9bff}33%{fill:#3ce6a8}66%{fill:#b79cff}}
.pu{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{opacity:.35}}
.bl{animation:bl 1.6s steps(1) infinite}
@keyframes bl{50%{opacity:.18}}
.pk{opacity:0;animation:pk 1.8s linear infinite}
@keyframes pk{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(64px);opacity:0}}


@media (prefers-reduced-motion: reduce){*{animation:none!important}.ch{opacity:0}.pk{opacity:0}}
]]></style>
<defs><filter id="glow" filterUnits="userSpaceOnUse" x="-840" y="-398" width="2520" height="1194"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x=".5" y=".5" width="839" height="397" rx="24" fill="#ffffff" stroke="#e0e0e0"/><text x="40.0" y="48.0" class="m" font-size="12" font-weight="500" fill="#6b6e80" letter-spacing="1.2">MEMBER TECHNICAL STAFF · ZOHO</text><text x="39.0" y="82.0" class="d" font-size="28" font-weight="700" fill="#0b0b14" letter-spacing="-0.6">What I&#x27;ve shipped</text><rect x="40.0" y="106.5" width="372.0" height="108" rx="16" fill="#f6f6f8" stroke="#e0e0e0"/><circle cx="74.0" cy="140" r="14" fill="#2563eb"/><text x="74.0" y="144.5" class="m" font-size="13" font-weight="700" fill="#f4f4fa" text-anchor="middle">1</text><text x="100.0" y="146.0" class="d" font-size="17" font-weight="700" fill="#0b0b14" letter-spacing="-0.3">Directory sync</text><text x="60.0" y="178.0" class="d" font-size="13.5" font-weight="400" fill="#2b2f47">Azure AD cloud sync, plus an on-prem Active</text><text x="60.0" y="198.0" class="d" font-size="13.5" font-weight="400" fill="#2b2f47">Directory agent that talks over WebSockets.</text><rect x="428.0" y="106.5" width="372.0" height="108" rx="16" fill="#f6f6f8" stroke="#e0e0e0"/><circle cx="462.0" cy="140" r="14" fill="#2563eb"/><text x="462.0" y="144.5" class="m" font-size="13" font-weight="700" fill="#f4f4fa" text-anchor="middle">2</text><text x="488.0" y="146.0" class="d" font-size="17" font-weight="700" fill="#0b0b14" letter-spacing="-0.3">Identity360 features</text><text x="448.0" y="178.0" class="d" font-size="13.5" font-weight="400" fill="#2b2f47">MFA Agents, GRC with JIT Access, Reports and</text><text x="448.0" y="198.0" class="d" font-size="13.5" font-weight="400" fill="#2b2f47">Dashboards for ManageEngine&#x27;s IAM product.</text><rect x="40.0" y="230.5" width="372.0" height="108" rx="16" fill="#f6f6f8" stroke="#e0e0e0"/><circle cx="74.0" cy="264" r="14" fill="#2563eb"/><text x="74.0" y="268.5" class="m" font-size="13" font-weight="700" fill="#f4f4fa" text-anchor="middle">3</text><text x="100.0" y="270.0" class="d" font-size="17" font-weight="700" fill="#0b0b14" letter-spacing="-0.3">Faster builds</text><text x="60.0" y="302.0" class="d" font-size="13.5" font-weight="400" fill="#2b2f47">Internal tool that cut CI/CD from 20 to 8 min:</text><text x="60.0" y="322.0" class="d" font-size="13.5" font-weight="400" fill="#2b2f47">multi-repo builds, parallel tests, cached deps.</text><rect x="428.0" y="230.5" width="372.0" height="108" rx="16" fill="#f6f6f8" stroke="#e0e0e0"/><circle cx="462.0" cy="264" r="14" fill="#2563eb"/><text x="462.0" y="268.5" class="m" font-size="13" font-weight="700" fill="#f4f4fa" text-anchor="middle">4</text><text x="488.0" y="270.0" class="d" font-size="17" font-weight="700" fill="#0b0b14" letter-spacing="-0.3">Zero-downtime migrations</text><text x="448.0" y="302.0" class="d" font-size="13.5" font-weight="400" fill="#2b2f47">Led 20+ schema and data migrations on</text><text x="448.0" y="322.0" class="d" font-size="13.5" font-weight="400" fill="#2b2f47">production MySQL with no service disruption.</text><text x="40.0" y="372.0" class="m" font-size="11" font-weight="500" fill="#6b6e80" letter-spacing="0.8">ALSO: MYSQL QUERY TUNING · AI-BUILT QENGINE TESTS (CLAUDE CODE) · MENTORING</text>
</svg>
